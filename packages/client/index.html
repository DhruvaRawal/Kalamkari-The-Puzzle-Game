<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d14" />
    <meta name="description" content="Kalamkari — a jigsaw and auction board game for 2–4 players." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kalamkari</title>
    <script>
      // Apply the theme before first paint (no light flash in dark mode). ThemeToggle takes over after.
      (function () {
        var t = null;
        try { t = localStorage.getItem('kalamkari.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
